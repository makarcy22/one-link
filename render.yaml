# Render blueprint: One Link API + PostgreSQL.
# Redis: use Upstash (free tier) and set REDIS_URL manually — see docs/deployment.md.
# Worker: needs an always-on service (paid on Render) — see docs/deployment.md options.
# After first deploy, replace the placeholder URLs below with your real ones.

services:
  - type: web
    name: one-link-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace @one-link/api
    startCommand: npm start --workspace @one-link/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: one-link-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://one-link-api.onrender.com
      - key: CLIENT_ORIGIN
        value: https://one-link.netlify.app
      - key: STORAGE_DRIVER
        value: local

databases:
  - name: one-link-db
    plan: free
